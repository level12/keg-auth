version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.14"
  apt_packages:
    - libldap2-dev
    - libsasl2-dev
  jobs:
    install:
      - pip install uv
    build:
      html:
        - uv run --frozen --only-group nox -- nox -s docs
        - mkdir -p "$READTHEDOCS_OUTPUT/html"
        - cp -av docs/build/html/. "$READTHEDOCS_OUTPUT/html/"
