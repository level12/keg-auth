[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'keg-auth'
description = 'Authentication plugin for Keg'
authors = [{name = 'Level 12 Developers', email = 'devteam@level12.io'}]
requires-python = '>=3.12'
dynamic = ['version']
readme = 'readme.rst'
classifiers = [
    'Development Status :: 4 - Beta',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
dependencies = [
    'bcrypt',
    'joserfc>=1.6.8',
    'markdown-it-py',
    'Flask-Login>0.4.1',
    'Keg>=0.11.0',
    'KegElements>=0.9.0',
    'inflect',
    'shortuuid',
    'webgrid>=0.4.13',
]

[project.urls]
Homepage = "https://github.com/level12/keg-auth"
Documentation = "https://keg-auth.readthedocs.io/"

[project.optional-dependencies]
tests = [
    'authlib',
    'email_validator',
    'flask-bootstrap',
    'flask-jwt-extended>=4.0.0',
    'flask-mail',
    'flask-webtest',
    'freezegun',
    'mock',
    'psycopg',
    'psycopg-binary',
    'python-ldap',
    'pyquery',
    'pytest',
    'pytest-cov',
    'requests',
    'xlsxwriter',
    'validators',
]
i18n = [
    'morphi>=0.3.2',
    'setuptools',
    'webgrid[i18n]',
]
jwt = [
    'flask-jwt-extended>=4.0.0',
]
ldap = [
    'python-ldap',
]
mail = [
    'Flask-Mail',
]
oauth = [
    'authlib',
    'requests',
]

[dependency-groups]
dev = [
    {include-group = 'pytest'},
    {include-group = 'prek'},
    {include-group = 'audit'},
    {include-group = 'build'},
    {include-group = 'docs'},
    {include-group = 'nox'},
    'click',
    'ruff==0.16.2',
]
pytest = [
    'authlib',
    'email_validator',
    'flask-bootstrap',
    'flask-jwt-extended>=4.0.0',
    'flask-mail',
    'flask-webtest',
    'freezegun',
    'mock',
    'psycopg',
    'psycopg-binary',
    'python-ldap',
    'pyquery',
    'pytest',
    'pytest-cov',
    'requests',
    'xlsxwriter',
    'validators',
]
psycopg2 = ['psycopg2-binary']
i18n = ['morphi>=0.3.2', 'webgrid[i18n]', 'setuptools']
prek = ['prek']
audit = ['pip-audit']
build = ['build', 'twine']
docs = [{include-group = 'pytest'}, 'sphinx']
nox = ['nox']

[tool.babel.extract_messages]
input_dirs = ['src/keg_auth']
mapping_file = 'src/keg_auth/i18n/babel.cfg'
output_file = 'src/keg_auth/i18n/keg_auth.pot'

[tool.babel.init_catalog]
domain = 'keg_auth'
input_file = 'src/keg_auth/i18n/keg_auth.pot'
output_dir = 'src/keg_auth/i18n'

[tool.babel.update_catalog]
domain = 'keg_auth'
input_file = 'src/keg_auth/i18n/keg_auth.pot'
output_dir = 'src/keg_auth/i18n'

[tool.babel.compile_catalog]
domain = 'keg_auth'
directory = 'src/keg_auth/i18n'

[tool.babel.compile_json]
domain = 'keg_auth'
directory = 'src/keg_auth/i18n'
output_dir = 'src/keg_auth/static/i18n'
